name: API Tests

# Reusable workflow — called by e2e.yml
# Runs all tests in tests/api/ via the dedicated 'api' project.
# No browser is installed — API tests authenticate over HTTP via the apiContext fixture.
# Must pass before cross-browser UI tests are allowed to start.
on:
  workflow_call:
    secrets:
      BASE_URL:
        required: true
      USER_NAME:
        required: true
      PASSWORD:
        required: true
      API_URL:
        required: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
#   1. test — runs tests/api/** via the 'api' project (no browser needed),
#             uploads JSON for self-heal and the reportingLabs HTML artifact
#
# Total elapsed-time budget: ≤ 20 minutes
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ── 1. API Tests ──────────────────────────────────────────────────────────
  test:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_NAME: ${{ secrets.USER_NAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      API_URL: ${{ secrets.API_URL }}
      REPORTING_LABS_TITLE: API Test Report
      REPORTING_LABS_METADATA_BUILD: ${{ github.run_number }}
      REPORTING_LABS_METADATA_ENV: ci
      REPORTING_LABS_METADATA_SHA: ${{ github.sha }}
      REPORTING_LABS_METADATA_SUITE: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        # reporters are configured in playwright.config.ts: github + json + reporting-labs
        run: npx playwright test --project=api

      - name: Stage results JSON for artifact upload
        if: ${{ !cancelled() }}
        run: |
          if [ -f test-results/results.json ]; then
            cp test-results/results.json test-results/results-api.json
          fi

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-json-api
          path: test-results/results-api.json
          retention-days: 2

      - name: Upload reportingLabs report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporting-labs-api
          path: reporting-labs/
          retention-days: 2

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-api
          path: test-results/
          retention-days: 2

